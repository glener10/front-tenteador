<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tenteador</title>
    <script>
      // Define data-theme antes da pintura para evitar flash de tema errado.
      (function () {
        try {
          var stored = localStorage.getItem("t-theme");
          var theme = stored
            ? stored
            : matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (_) {
          /* ponytail: storage indisponível usa o default (light) */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
