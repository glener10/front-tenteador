<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tenteador</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='3' y='2' width='18' height='20' rx='2.5' fill='%23fff' stroke='%23131a10' stroke-width='1.6'/%3E%3Ctext x='12' y='16' text-anchor='middle' font-size='13' fill='%23d33'%3E%E2%99%A5%3C/text%3E%3C/svg%3E"
    />
    <meta name="theme-color" content="#faf5e6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#131a10" media="(prefers-color-scheme: dark)" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      // Define data-theme antes da pintura para evitar flash de tema errado.
      (function () {
        try {
          var stored = localStorage.getItem("t-theme");
          var theme = stored
            ? stored
            : matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (_) {
          /* ponytail: storage indisponível usa o default (light) */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
